<div class="max-w-4xl mx-auto space-y-6">
  <!-- Header -->
  <div class="flex items-center gap-4 mb-6">
    <button (click)="cancel()" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-500">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div>
      <h1 class="text-2xl font-bold text-slate-900">{{ isEditMode ? 'Edit Asset' : 'Register New Asset' }}</h1>
      <p class="text-sm text-slate-500 mt-1">{{ isEditMode ? 'Update asset details' : 'Add a new physical asset to your property' }}</p>
    </div>
  </div>

  <div *ngIf="loading" class="flex justify-center p-12">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
  </div>

  <div *ngIf="!loading" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="p-6 sm:p-8">
      
      <div *ngIf="error" class="mb-6 bg-red-50 text-red-700 p-4 rounded-xl flex items-center gap-3">
        <i class="fas fa-exclamation-circle"></i>
        <span>{{ error }}</span>
      </div>

      <div class="space-y-8">
        
        <!-- Basic Info Section -->
        <div>
          <h3 class="text-sm font-semibold text-indigo-600 uppercase tracking-wider mb-4 flex items-center gap-2">
            <i class="fas fa-info-circle"></i> Basic Information
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-1.5">
              <label class="text-sm font-medium text-slate-700">Asset Name *</label>
              <input type="text" [(ngModel)]="form.assetName" placeholder="e.g. Main Lobby Elevator" 
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
            </div>

            <div class="space-y-1.5">
              <label class="text-sm font-medium text-slate-700">Asset Type</label>
              <select [(ngModel)]="form.assetType" 
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all bg-white">
                <option *ngFor="let t of assetTypes" [value]="t">{{ t }}</option>
              </select>
            </div>

            <div class="space-y-1.5 md:col-span-2">
              <label class="text-sm font-medium text-slate-700">Location</label>
              <input type="text" [(ngModel)]="form.location" placeholder="e.g. Block A, Basement" 
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
            </div>
          </div>
        </div>

        <hr class="border-slate-100">

        <!-- Lifecycle Section -->
        <div>
          <h3 class="text-sm font-semibold text-emerald-600 uppercase tracking-wider mb-4 flex items-center gap-2">
            <i class="fas fa-calendar-alt"></i> Lifecycle & Maintenance
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="space-y-1.5">
              <label class="text-sm font-medium text-slate-700">Installation Date *</label>
              <input type="date" [(ngModel)]="form.installationDate" 
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all">
            </div>
            <div class="space-y-1.5">
              <label class="text-sm font-medium text-slate-700">Lifespan (Years)</label>
              <input type="number" [(ngModel)]="form.expLifespanYears" 
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all">
            </div>
            <div class="space-y-1.5">
              <label class="text-sm font-medium text-slate-700">Maint. Interval (Days)</label>
              <input type="number" [(ngModel)]="form.maintenanceIntervalDays" 
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all">
            </div>
          </div>
        </div>

        <hr class="border-slate-100">

        <!-- Vendor Section -->
        <div>
          <h3 class="text-sm font-semibold text-amber-600 uppercase tracking-wider mb-4 flex items-center gap-2">
            <i class="fas fa-industry"></i> Manufacturer & Vendor
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-1.5">
              <label class="text-sm font-medium text-slate-700">Manufacturer</label>
              <input type="text" [(ngModel)]="form.manufacturer" placeholder="e.g. Otis" 
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all">
            </div>
            <div class="space-y-1.5">
              <label class="text-sm font-medium text-slate-700">Model Number</label>
              <input type="text" [(ngModel)]="form.modelNumber" placeholder="e.g. Gen2" 
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all">
            </div>
            <div class="space-y-1.5">
              <label class="text-sm font-medium text-slate-700">Supplier Name</label>
              <input type="text" [(ngModel)]="form.supplierName" placeholder="e.g. Otis Malaysia Sdn Bhd" 
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all">
            </div>
            <div class="space-y-1.5">
              <label class="text-sm font-medium text-slate-700">Warranty Expiry</label>
              <input type="date" [(ngModel)]="form.warrantyExpiryDate" 
                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all">
            </div>
          </div>
        </div>

      </div>

      <!-- Footer Buttons -->
      <div class="mt-10 pt-6 border-t border-slate-100 flex justify-end gap-3">
        <button (click)="cancel()" [disabled]="saving"
          class="px-6 py-2.5 rounded-xl text-slate-600 font-medium hover:bg-slate-50 transition-colors border border-slate-200">
          Cancel
        </button>
        <button (click)="save()" [disabled]="saving"
          class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition-colors shadow-sm disabled:opacity-70 flex items-center gap-2">
          <i class="fas fa-spinner fa-spin" *ngIf="saving"></i>
          {{ isEditMode ? 'Save Changes' : 'Register Asset' }}
        </button>
      </div>

    </div>
  </div>
</div>
