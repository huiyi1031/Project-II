<div class="layout-wrapper">

  <!-- ══════ TOP NAVIGATION (FULL WIDTH) ══════ -->
  <header class="app-topnav">

    <div class="topnav-left">
      <button class="hamburger" [class.active]="isSidebarOpen" (click)="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>

      <div class="brand" (click)="navigate({label:'Dashboard',route:'dashboard'})">
        <img src="assets/logo.jpg" alt="PropertyCare Logo" class="brand-logo"
          style="width: 40px; height: 40px; object-fit: contain; border-radius: 8px;">
        <div class="brand-text hidden md:flex flex-col ml-3">
          <span class="brand-name">PropertyCare</span>
          <span class="brand-role">Maintenance & Upkeep</span>
        </div>
      </div>
    </div>

    <div class="topnav-right">



      <button class="icon-btn">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <div class="badge-indicator"></div>
      </button>

      <button class="icon-btn" (click)="navigate({label:'Chat',route:'chat'})">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      </button>

      <div class="profile-wrap" (click)="$event.stopPropagation()">
        <div class="profile-trigger" (click)="toggleProfileMenu($event)">
          <div class="avatar">{{ getInitial() }}</div>
          <div class="profile-info">
            <span class="profile-name">{{ userName }}</span>
            <span class="profile-role">{{ roleLabel === 'PropertyManager' ? 'Property Manager' : roleLabel }}</span>
          </div>
          <svg class="w-4 h-4 text-slate-400 hidden md:block ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </div>

        <!-- Profile Dropdown -->
        <div class="profile-dropdown" *ngIf="isProfileMenuOpen">
          <div class="profile-header md:hidden">
            <div class="avatar w-10 h-10">{{ getInitial() }}</div>
            <div class="flex flex-col">
              <span class="text-sm font-bold text-[var(--navy)]">{{ userName }}</span>
              <span class="text-xs text-slate-500">{{ userEmail }}</span>
            </div>
          </div>

          <button class="profile-item" (click)="navigate({label:'Profile',route:'profile'}); isProfileMenuOpen = false">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            My Profile
          </button>
          <button *ngIf="roleLabel === 'Occupant' && occupantType !== 'Tenant'" class="profile-item"
            (click)="navigate({label:'Family',route:'family'}); isProfileMenuOpen = false">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            My Family
          </button>
          <button *ngIf="roleLabel === 'Occupant' && occupantType === 'Owner'" class="profile-item"
            (click)="navigate({label:'Tenants',route:'tenants'}); isProfileMenuOpen = false">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            My Tenants
          </button>

          <div class="h-px bg-slate-100 my-1"></div>

          <button class="profile-item profile-logout" (click)="logout()">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3-3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Logout
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- ══════ LAYOUT BODY ══════ -->
  <div class="layout-body">

    <!-- OVERLAY (MOBILE) -->
    <div class="overlay" *ngIf="isSidebarOpen" (click)="toggleSidebar()"></div>

    <!-- LEFT SIDEBAR -->
    <aside class="app-sidebar" [class.sidebar-hidden]="!isSidebarOpen" (click)="$event.stopPropagation()">
      <!-- Navigation Menu -->
      <nav class="nav-menu">
        <ng-container *ngFor="let item of menuItems">

          <!-- Simple link -->
          <button *ngIf="!item.children" class="nav-item" [class.nav-active]="isActive(item)" (click)="navigate(item)">
            <!-- Dynamic Icons based on label text -->
            <svg *ngIf="item.label.includes('Dashboard')" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <svg *ngIf="item.label.includes('Request') || item.label.includes('Report')" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <svg *ngIf="item.label.includes('Work Order') || item.label.includes('Execute')" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg *ngIf="item.label.includes('Chat')" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
            <svg *ngIf="item.label.includes('Assets')" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
            <svg *ngIf="item.label.includes('Property Units') || item.label.includes('My Property')" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <svg *ngIf="item.label.includes('Proactive')" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <svg
              *ngIf="item.label.includes('Account') || item.label.includes('Staff') || item.label.includes('Occupants')"
              fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>

            <span class="nav-item-text">{{ item.label }}</span>
          </button>

          <!-- Dropdown group -->
          <div *ngIf="item.children" class="nav-dropdown-wrap">
            <button class="nav-item nav-has-dropdown" [class.nav-active]="isActive(item)"
              (click)="toggleDropdown(item.label, $event)">
              <div class="flex items-center gap-3">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <span class="nav-item-text">{{ item.label }}</span>
              </div>
              <svg class="chevron" [class.chevron-open]="openDropdown === item.label" width="16" height="16"
                viewBox="0 0 24 24" fill="none">
                <path d="M19 9l-7 7-7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>

            <div class="nav-dropdown" *ngIf="openDropdown === item.label">
              <button *ngFor="let child of item.children" class="nav-dropdown-item"
                [class.nav-active]="activeItem === child.route" (click)="navigate(child)">
                {{ child.label }}
              </button>
            </div>
          </div>

        </ng-container>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <main class="app-main">
        <div class="fade-in">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>

  </div>

</div>
